# Publication automatique : poussez une étiquette v1.0.1 et les deux paquets partent en ligne.
#   
# Une version déjà publiée est simplement sautée, donc republier le même tag ne casse rien.
#
# À faire une seule fois :
#  - npm  : secret NPM_TOKEN dans le dépôt (Settings → Secrets → Actions), jeton « granular »
#           avec le droit de publier sur @easyyad/bot-sdk.
#  - PyPI : aucun jeton. Sur pypi.org → Publishing, déclarez ce dépôt comme « trusted publisher »
#           (workflow publish.yml, environnement pypi). Pour un paquet pas encore créé,
#           utilisez « Add a pending publisher ».
name: Publication (npm + PyPI)
on:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: javascript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - run: npm test
      - name: Publish if this version is not already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EN_LIGNE=$(npm view "@easyyad/bot-sdk@$VERSION" version 2>/dev/null || true)
          if [ "$EN_LIGNE" = "$VERSION" ]; then
            echo "@easyyad/bot-sdk $VERSION is already on npm: nothing to do."
          else
            npm publish --access public
          fi

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # publication de confiance PyPI : aucun jeton à stocker
      contents: read
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests
      - run: pip install --quiet --upgrade build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true
