[project]
name = "easyad"
version = "1.0.0"
description = "Affichez des publicités EasyAd dans votre bot Telegram et soyez rémunéré."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["telegram", "bot", "ads", "monetization", "easyad"]

[project.optional-dependencies]
async = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["easyad"]
